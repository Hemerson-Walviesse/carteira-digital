spring.application.name=carteira-digital

# lê o mesmo .env do Docker
spring.config.import=optional:file:.env[.properties]

# banco
spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# JPA: quem cria tabela é o Flyway, o Hibernate só confere
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiracao-minutos=15
jwt.refresh-expiracao-dias=7